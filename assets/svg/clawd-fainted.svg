<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Fainted: flat on the floor, legs up, X eyes, stars circling */
      .faint-breathe {
        transform-origin: 7.5px 15px;
        animation: faint-breathe 6s infinite ease-in-out;
      }

      .faint-shadow {
        transform-origin: 7.5px 15.5px;
        animation: faint-shadow 6s infinite ease-in-out;
      }

      /* Legs twitch now and then */
      .leg-twitch {
        transform-origin: 7.5px 10px;
        animation: leg-twitch 6s infinite ease-in-out;
      }

      .star {
        opacity: 0;
        animation: star-orbit 3.6s infinite linear;
      }
      .star-2 { animation-delay: 1.2s; }
      .star-3 { animation-delay: 2.4s; }

      @keyframes faint-breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.01, 1.06); }
      }

      @keyframes faint-shadow {
        0%, 100% { transform: scaleX(1); opacity: 0.4; }
        50%      { transform: scaleX(1.03); opacity: 0.45; }
      }

      @keyframes leg-twitch {
        0%, 84%, 100% { transform: translate(0, 0); }
        87%           { transform: translate(0, -0.6px); }
        90%           { transform: translate(0, 0); }
        93%           { transform: translate(0, -0.4px); }
      }

      /* Stars travel an ellipse above the body */
      @keyframes star-orbit {
        0%   { transform: translate(1px, 7px);  opacity: 0; }
        10%  { opacity: 1; }
        25%  { transform: translate(5px, 5.5px); }
        50%  { transform: translate(9px, 7px); }
        75%  { transform: translate(5px, 8px); }
        90%  { opacity: 1; }
        100% { transform: translate(1px, 7px);  opacity: 0; }
      }
    </style>

    <!-- Pixel star -->
    <g id="pixel-star">
      <rect x="1" y="0" width="1" height="3"/>
      <rect x="0" y="1" width="3" height="1"/>
    </g>
  </defs>

  <rect id="ground-shadow" class="faint-shadow" x="-1" y="15" width="17" height="1" fill="#000000"/>

  <!-- Circling stars -->
  <g class="stars">
    <use href="#pixel-star" class="star star-1" fill="#FFD54F"/>
    <use href="#pixel-star" class="star star-2" fill="#FFE082"/>
    <use href="#pixel-star" class="star star-3" fill="#FFF3C4"/>
  </g>

  <g class="faint-breathe">
    <!-- Legs sticking straight up -->
    <g class="leg-twitch" fill="#DE886D">
      <rect id="outer-left-leg-up" x="3" y="8" width="1" height="2"/>
      <rect id="inner-left-leg-up" x="5" y="8" width="1" height="2"/>
      <rect id="inner-right-leg-up" x="9" y="8" width="1" height="2"/>
      <rect id="outer-right-leg-up" x="11" y="8" width="1" height="2"/>
    </g>

    <!-- Flat body on the floor, arms splayed -->
    <g fill="#DE886D">
      <rect id="torso-fainted" x="1" y="10" width="13" height="5"/>
      <rect id="left-arm-fainted" x="-1" y="14" width="2" height="1"/>
      <rect id="right-arm-fainted" x="14" y="14" width="2" height="1"/>
    </g>

    <!-- X eyes -->
    <g fill="#000000">
      <rect x="3.5" y="11.5" width="0.6" height="0.6"/>
      <rect x="4.7" y="11.5" width="0.6" height="0.6"/>
      <rect x="4.1" y="12.1" width="0.6" height="0.6"/>
      <rect x="3.5" y="12.7" width="0.6" height="0.6"/>
      <rect x="4.7" y="12.7" width="0.6" height="0.6"/>

      <rect x="9.7" y="11.5" width="0.6" height="0.6"/>
      <rect x="10.9" y="11.5" width="0.6" height="0.6"/>
      <rect x="10.3" y="12.1" width="0.6" height="0.6"/>
      <rect x="9.7" y="12.7" width="0.6" height="0.6"/>
      <rect x="10.9" y="12.7" width="0.6" height="0.6"/>
    </g>

    <!-- Tongue poking out -->
    <rect x="7" y="13.6" width="1" height="0.8" fill="#E57373"/>
  </g>
</svg>
